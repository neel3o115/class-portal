<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Class Portal</title>
<style>
  :root {
    --bg: #f3f6fa; --ink: #14213d; --muted: #5b6b86; --line: #d5dde8;
    --accent: #2457f5; --row: #ffffff;
    box-sizing: border-box;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1624; --ink: #e8eefc; --muted: #93a3c0; --line: #26334d; --accent: #7aa2ff; --row: #16203a; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body { font: 17px/1.5 ui-rounded, "Avenir Next", "Segoe UI", system-ui, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 48px 20px 80px; }
  h1 { font-size: 2rem; line-height: 1.15; margin: 0 0 6px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); margin: 0 0 28px; }
  input[type=search] {
    width: 100%; font: inherit; color: inherit; background: var(--row);
    border: 2px solid var(--line); border-radius: 10px; padding: 12px 14px;
  }
  input[type=search]:focus { outline: 3px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
  ul { list-style: none; margin: 20px 0 0; padding: 0; border-top: 1px solid var(--line); }
  li { border-bottom: 1px solid var(--line); }
  a.task { display: flex; gap: 16px; align-items: baseline; padding: 18px 8px; text-decoration: none; color: inherit; }
  a.task:hover, a.task:focus-visible { background: var(--row); outline: none; }
  a.task:focus-visible { box-shadow: inset 3px 0 0 var(--accent); }
  .t { font-weight: 650; color: var(--accent); }
  .d { color: var(--muted); font-size: 0.95rem; margin-top: 2px; }
  .host { margin-left: auto; color: var(--muted); font-size: 0.85rem; white-space: nowrap; }
  .empty { color: var(--muted); padding: 24px 8px; }
  @media (max-width: 520px) { .host { display: none; } }
</style>
</head>
<body>
<main>
  <h1 id="title"></h1>
  <p class="sub" id="sub"></p>
  <input type="search" id="q" placeholder="Search tasks by title" aria-label="Search tasks" autofocus>
  <ul id="list"></ul>
  <p class="empty" id="empty" hidden>Nothing matches that search. Clear the box to see all tasks.</p>
</main>

<script>
  // ===== EDIT THIS BEFORE EACH CLASS =====
  const CLASS_TITLE = "Today's tasks";
  const CLASS_NOTE = "Open a task, finish it, then use the Home button to come back here.";

  const TASKS = [
    // { title: "Codeforces problemset",  desc: "Pick a problem from the list your teacher shared.", url: "https://codeforces.com/problemset" },
    // { title: "LeetCode practice",       desc: "Solve the problem announced in class.",            url: "https://leetcode.com/problemset/" }
    { title: "applied physics 1 resources", desc: "play around", url: "https://gauravsingh115.github.io/applied_physics1/" }
    // Add more like this (don't forget the comma between items):
    // { title: "Subset simulator", desc: "Play with it and note what you observe.", url: "https://example.com/sim" },
  ];
  // =======================================

  document.getElementById("title").textContent = CLASS_TITLE;
  document.getElementById("sub").textContent = CLASS_NOTE;

  const list = document.getElementById("list");
  const empty = document.getElementById("empty");
  const q = document.getElementById("q");

  function hostOf(u) { try { return new URL(u).hostname.replace(/^www\./, ""); } catch (e) { return ""; } }

  function render() {
    const term = q.value.trim().toLowerCase();
    const shown = TASKS.filter(t => (t.title + " " + t.desc).toLowerCase().includes(term));
    list.innerHTML = "";
    shown.forEach(t => {
      const li = document.createElement("li");
      const a = document.createElement("a");
      a.className = "task"; a.href = t.url;
      const box = document.createElement("div");
      const title = document.createElement("div"); title.className = "t"; title.textContent = t.title;
      const desc = document.createElement("div"); desc.className = "d"; desc.textContent = t.desc;
      box.append(title, desc);
      const host = document.createElement("span"); host.className = "host"; host.textContent = hostOf(t.url);
      a.append(box, host); li.append(a); list.append(li);
    });
    empty.hidden = shown.length > 0;
  }
  q.addEventListener("input", render);
  render();
</script>
</body>
</html>
